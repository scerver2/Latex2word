<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convertidor de LaTeX a Word</title>
    
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Crimson+Pro:wght@300;600;800&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        bgPrimary: '#0a0e27',
                        bgSecondary: '#151933',
                        bgTertiary: '#1e2340',
                        accentPrimary: '#00ff88',
                        accentSecondary: '#ff0080',
                        accentTertiary: '#00d4ff',
                    },
                    fontFamily: {
                        mono: ['"JetBrains Mono"', 'monospace'],
                        serif: ['"Crimson Pro"', 'serif'],
                        sans: ['system-ui', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']]
            },
            startup: { typeset: false }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    
    <style>
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #1e2340; border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #00d4ff; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #00ff88; }

        .document-preview {
            font-family: "Times New Roman", Times, serif;
            color: #000;
            line-height: 1.6;
            background-color: white;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        .document-preview h1 { font-size: 1.5em; font-weight: bold; margin-top: 1.5em; margin-bottom: 0.5em; }
        .document-preview h2 { font-size: 1.25em; font-weight: bold; margin-top: 1.2em; margin-bottom: 0.5em; }
        .document-preview h3 { font-size: 1.1em; font-weight: bold; margin-top: 1em; margin-bottom: 0.5em; }
        .document-preview p { margin-bottom: 1em; }
        .document-preview ul { list-style-type: disc; margin-left: 2em; margin-bottom: 1em; }
        .document-preview hr { border: 0; border-top: 1px solid #ccc; margin: 1.5em 0; }
        
        .glow-primary { box-shadow: 0 0 10px rgba(0, 255, 136, 0.2); border-color: rgba(0, 255, 136, 0.4); }
        .glow-primary:focus-within { box-shadow: 0 0 15px rgba(0, 255, 136, 0.4); border-color: #00ff88; }
        .glow-tertiary { box-shadow: 0 0 10px rgba(0, 212, 255, 0.2); }
    </style>
</head>
<body class="bg-bgPrimary text-gray-200 min-h-screen p-4 md:p-8 flex flex-col">

    <div class="max-w-7xl mx-auto w-full flex-grow">
        
        <header class="mb-8 text-center md:text-left">
            <h1 class="text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-accentPrimary to-accentTertiary tracking-tight mb-2">Convertidor de LaTeX a Word</h1>
            <p class="text-gray-400 font-serif text-lg">Processament visual i exportació de documents amb format acadèmic.</p>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            
            <div class="bg-bgSecondary rounded-xl p-5 flex flex-col h-[70vh] border border-bgTertiary glow-primary transition-all duration-300">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-lg font-bold text-accentPrimary flex items-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><path d="m10 13-2 2 2 2"/><path d="m14 17 2-2-2-2"/></svg>
                        Codi Font LaTeX
                    </h2>
                    <div class="flex gap-2">
                        <button onclick="clearEditor()" class="border border-accentSecondary text-accentSecondary hover:bg-accentSecondary hover:text-white font-bold py-2 px-4 rounded-lg transition-all flex items-center gap-2 text-sm">
                            Esborrar
                        </button>
                        <button onclick="renderPreview()" class="bg-accentPrimary text-bgPrimary hover:bg-green-400 font-bold py-2 px-4 rounded-lg transition-all shadow-[0_0_10px_rgba(0,255,136,0.3)] hover:shadow-[0_0_20px_rgba(0,255,136,0.6)] text-sm">
                            Renderitzar Fórmules
                        </button>
                    </div>
                </div>
                <textarea id="latex-input" class="flex-1 w-full p-4 rounded-lg font-mono text-sm bg-bgTertiary text-gray-300 resize-none outline-none border border-transparent" spellcheck="false" placeholder="Enganxa aquí el teu codi LaTeX..."></textarea>
            </div>

            <div class="bg-bgSecondary rounded-xl p-5 flex flex-col h-[70vh] border border-bgTertiary glow-tertiary">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-lg font-bold text-accentTertiary flex items-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><path d="M8 13h2"/><path d="M8 17h2"/><path d="M14 13h2"/><path d="M14 17h2"/></svg>
                        Vista Prèvia i Exportació
                    </h2>
                    <div class="flex gap-3">
                        <button onclick="copyToClipboard()" class="border border-accentTertiary text-accentTertiary hover:bg-accentTertiary hover:text-bgPrimary font-bold py-2 px-4 rounded-lg transition-all flex items-center gap-2 text-sm">
                            Copiar
                        </button>
                        <button onclick="downloadDoc()" class="bg-accentSecondary text-white hover:opacity-80 font-bold py-2 px-4 rounded-lg transition-all shadow-[0_0_10px_rgba(255,0,128,0.3)] hover:shadow-[0_0_20px_rgba(255,0,128,0.6)] flex items-center gap-2 text-sm">
                            Descarregar .doc
                        </button>
                    </div>
                </div>
                
                <div id="preview-wrapper" class="flex-1 overflow-auto rounded-lg bg-gray-800 relative p-4 border border-bgTertiary">
                    <div id="loading-overlay" class="absolute inset-0 bg-bgPrimary/80 flex items-center justify-center z-10 hidden rounded-lg backdrop-blur-sm">
                        <div class="animate-spin rounded-full h-10 w-10 border-t-2 border-b-2 border-accentPrimary"></div>
                    </div>
                    <div id="preview-content" class="document-preview p-8 max-w-[21cm] mx-auto min-h-full rounded-sm">
                        <p class="text-gray-500 font-sans text-center mt-10">Fes clic a "Renderitzar Fórmules" per processar el document.</p>
                    </div>
                </div>
            </div>
            
        </div>
    </div>

    <footer class="mt-12 text-center pb-6">
        <p class="text-gray-400 font-serif italic tracking-wide">
            Creat per <span class="text-accentPrimary font-bold not-italic">Salvador Cervera</span> per la comunitat amb <span class="text-accentSecondary not-italic animate-pulse">❤️</span>
        </p>
    </footer>

    <script>
        const defaultLatexText = String.raw`\documentclass[11pt, a4paper]{article}
\begin{document}
\begin{center}
    {\Large \textbf{Exemple de Document}}
\end{center}
\section*{1. Introducció}
Benvingut a l'editor. Pots esborrar aquest text amb el nou botó o renderitzar-lo per veure el resultat.
\[ E = mc^2 \]
\end{document}`;

        function showMessage(msg, isError = false) {
            const toast = document.createElement('div');
            toast.className = `fixed bottom-4 right-4 px-6 py-3 rounded-lg shadow-lg text-white font-mono text-sm ${isError ? 'bg-accentSecondary' : 'bg-bgTertiary border border-accentPrimary'} transition-opacity duration-300 z-50 shadow-[0_0_10px_rgba(0,255,136,0.3)]`;
            toast.textContent = msg;
            document.body.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => document.body.removeChild(toast), 300);
            }, 3000);
        }

        // FUNCIÓ PER ESBORRAR EL CONTINGUT
        function clearEditor() {
            if (confirm("Segur que vols esborrar tot el codi LaTeX?")) {
                document.getElementById('latex-input').value = "";
                document.getElementById('preview-content').innerHTML = '<p class="text-gray-500 font-sans text-center mt-10">Fes clic a "Renderitzar Fórmules" per processar el document.</p>';
                showMessage("Editor buidat");
            }
        }

        function parseLatex(tex) {
            let body = tex;
            const bodyMatch = tex.match(/\\begin\{document\}([\s\S]*?)\\end\{document\}/);
            if (bodyMatch) body = bodyMatch[1];

            body = body.replace(/\\begin\{center\}([\s\S]*?)\\end\{center\}/g, '<div style="text-align: center;">$1</div>');
            body = body.replace(/\{\\Large\s+((?:[^{}]|\{[^{}]*\})*)\}/g, '<span style="font-size: 1.5em; font-weight: bold;">$1</span>');
            body = body.replace(/\\section\*?\{((?:[^{}]|\{[^{}]*\})*)\}/g, '<h1>$1</h1>');
            body = body.replace(/\\subsection\*?\{((?:[^{}]|\{[^{}]*\})*)\}/g, '<h2>$1</h2>');
            body = body.replace(/\\textbf\{((?:[^{}]|\{[^{}]*\})*)\}/g, '<strong>$1</strong>');
            body = body.replace(/\\textit\{((?:[^{}]|\{[^{}]*\})*)\}/g, '<em>$1</em>');
            body = body.replace(/\\noindent/g, '');
            body = body.replace(/\\vspace\{[^}]+\}/g, '<br/>');
            body = body.replace(/\\hrule/g, '<hr/>');
            body = body.replace(/\\\\/g, '<br/>');
            body = body.replace(/\\begin\{itemize\}/g, '<ul>');
            body = body.replace(/\\end\{itemize\}/g, '</ul>');
            body = body.replace(/\\item\s+(.*?)(?=(?:\\item|\\end\{itemize\}))/gs, '<li>$1</li>'); 

            const parts = body.split(/\n\s*\n/);
            body = parts.map(part => {
                const trimmed = part.trim();
                if (!trimmed || trimmed.match(/^(<h|<div|<ul|<hr)/)) return trimmed;
                return `<p>${trimmed}</p>`;
            }).join('\n');

            return body;
        }

        function renderPreview() {
            const loading = document.getElementById('loading-overlay');
            const input = document.getElementById('latex-input').value;
            const previewEl = document.getElementById('preview-content');
            
            if(!input.trim()) {
                showMessage("L'editor està buit.", true);
                return;
            }

            loading.classList.remove('hidden');
            previewEl.innerHTML = parseLatex(input);
            
            if (window.MathJax && window.MathJax.typesetPromise) {
                MathJax.typesetPromise([previewEl]).then(() => {
                    loading.classList.add('hidden');
                    showMessage("✔ Fórmules llestes");
                }).catch(() => {
                    loading.classList.add('hidden');
                    showMessage("Error en el renderitzat", true);
                });
            } else {
                loading.classList.add('hidden');
            }
        }

        function downloadDoc() {
            const previewEl = document.getElementById('preview-content');
            if(!previewEl.innerHTML.trim() || previewEl.innerText.includes("Fes clic a")) {
                showMessage("Processa primer el document.", true);
                return;
            }
            const html = `<html><head><meta charset='utf-8'></head><body style='font-family:serif'>${previewEl.innerHTML}</body></html>`;
            const blob = new Blob(['\ufeff', html], { type: 'application/msword' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'document.doc';
            link.click();
        }

        function copyToClipboard() {
            const previewEl = document.getElementById('preview-content');
            const range = document.createRange();
            range.selectNode(previewEl);
            window.getSelection().removeAllRanges();
            window.getSelection().addRange(range);
            document.execCommand('copy');
            window.getSelection().removeAllRanges();
            showMessage('✔ Copiat al porta-retalls');
        }

        window.onload = () => {
            document.getElementById('latex-input').value = defaultLatexText;
        };
    </script>
</body>
</html>
